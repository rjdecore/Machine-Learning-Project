name: Python validation

on:
  pull_request:
  push:
    branches: [main, hiring-ready-ml-readme]

jobs:
  syntax-and-recommender-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source files
        run: python -m compileall -q .
      - name: Install movie recommender dependencies
        working-directory: Movie-Recommender_system
        run: python -m pip install -r requirements.txt
      - name: Check recommender app syntax
        working-directory: Movie-Recommender_system
        run: python -m py_compile app.py
